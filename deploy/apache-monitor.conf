# monitor.smartdeontech.com -> DeonTech Pulse on 127.0.0.1:3201
#
# Installed by provision.sh as /etc/apache2/sites-available/monitor.smartdeontech.com.conf.
# Then:  sudo certbot --apache -d monitor.smartdeontech.com --redirect
# certbot copies this into a -le-ssl.conf vhost on :443 and turns :80 into a redirect.
<VirtualHost *:80>
    ServerName monitor.smartdeontech.com

    ProxyPreserveHost On
    ProxyRequests Off
    # Pulse sets its own security headers; tell it the visitor came over HTTPS.
    RequestHeader set X-Forwarded-Proto "https"

    # Let certbot's HTTP challenge reach Apache itself, not Pulse.
    ProxyPass /.well-known/acme-challenge !

    # Live stream (Server-Sent Events): unbuffered, uncompressed, long-lived.
    # Must come BEFORE the general ProxyPass.
    SetEnvIf Request_URI "^/api/stream" no-gzip=1
    ProxyPass        /api/stream http://127.0.0.1:3201/api/stream flushpackets=on timeout=600
    ProxyPassReverse /api/stream http://127.0.0.1:3201/api/stream

    ProxyPass        / http://127.0.0.1:3201/
    ProxyPassReverse / http://127.0.0.1:3201/

    ErrorLog ${APACHE_LOG_DIR}/monitor-error.log
    CustomLog ${APACHE_LOG_DIR}/monitor-access.log combined
</VirtualHost>
