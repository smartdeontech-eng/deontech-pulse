<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName app.smartdeontech.com
    ServerAlias smartdeontech.com www.smartdeontech.com
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/
SSLCertificateFile /etc/letsencrypt/live/app.smartdeontech.com/fullchain.pem
</VirtualHost>
</IfModule>
